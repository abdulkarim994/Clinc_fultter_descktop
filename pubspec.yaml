name: dental_clinic_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  drift: ^2.34.2
  sqlite3: ^3.5.0
  path_provider: ^2.1.6
  pdf: ^3.13.0
  # م77 — كان `any`. القيد المفتوح يعني أن `flutter pub upgrade` قد يقفز
  # بالحزمة إلى إصدار كاسر بلا تغيير سطر واحد هنا — وفي تطبيق كل واجهته
  # عربية وكل تواريخه محلية، انحدارُ تنسيق تاريخ يمرّ بلا كشف. القيمة
  # تطابق ما ثبّته pubspec.lock فعلاً وما يتوافق مع flutter_localizations.
  intl: ^0.20.2
  path: ^1.9.1
  crypto: ^3.0.7
  image: ^4.9.1
  file_selector: ^1.1.0
  http: ^1.6.0
  printing: ^5.15.0
  url_launcher: ^6.3.2
  archive: ^4.0.9
  connectivity_plus: ^7.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  image_picker: ^1.2.3
  # م172 — الكاميرا الداخلية للأشعة (تصوير مباشر داخل التطبيق لا تطبيق
  # الكاميرا الأساسي) — معاينة حية + التقاط وحفظ فوري في مسار الرفع.
  camera: ^0.11.0
  # م174 — عارض الأشعة: حفظ الصورة/المقارنة في معرض الهاتف.
  gal: ^2.3.0
  # م174 — مشاركة صورة المقارنة قبل/بعد (واتساب وغيره).
  share_plus: ^10.1.0
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.2
  supabase_flutter: ^2.16.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # م67 — يُستعمل في اختبار تغطية محارف PDF (تشكيل bidi) — وهو تبعية
  # تعدّاءة عبر حزمة pdf أصلاً، يُعلَن هنا صراحةً لرضا محلل الاعتمادات.
  bidi: ^2.0.13

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  # ⚠ msix أداةُ سطرِ أوامرٍ لا حزمةُ إضافةٍ أصيلة — لكنّ pubspec الخاص بها
  # يعلن `platforms: windows` (وسمُ pub.dev)، فيلتقطها حلّالُ إضافات Flutter
  # على ويندوز كإضافةٍ أصيلةٍ بلا كود native فتفشل تهيئة CMake:
  #   Could not find a package configuration file provided by "msix"
  # لذا **أُخرِجت من الاعتماديات**؛ حزمة MSIX تُبنى بلا إضافتها للمشروع عبر:
  #   dart pub global activate msix && dart pub global run msix:create
  # (إعداد msix_config أدناه يبقى صالحاً لذلك الأمر). بناء الـEXE لا يتأثر.
  fake_async: ^1.3.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  # خطوط PDF تُقرأ بايتات عبر rootBundle — يلزم إدراجها أصولاً صريحة أيضاً.
  assets:
    - assets/fonts/
    # م180/د — شعار DENTSHINE داخل التطبيق (شاشة الدخول).
    - assets/icon/icon-512.png

  fonts:
    - family: Qomra
      fonts:
        - asset: assets/fonts/Qomra-Regular.ttf
          weight: 400
        - asset: assets/fonts/Qomra-Medium.ttf
          weight: 500
        - asset: assets/fonts/Qomra-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

# ── أيقونات المشغّل (أندرويد + ويندوز) من أيقونة التطبيق الأصلية ──
flutter_launcher_icons:
  image_path: "assets/icon/icon-512.png"
  android: true
  min_sdk_android: 21
  # 🔴 م183 — **المصدر الرسمي للأيقونات هو `tool/gen_icons.py` لا هذه
  # الأداة.** تُترك الإعدادات هنا للتوافق فقط؛ وتشغيل flutter_launcher_icons
  # سيدهس `mipmap-anydpi-v26/ic_launcher.xml` فيستبدل الخلفية المتدرّجة
  # (drawable/ic_launcher_bg.xml) بلونٍ مسطّح — فإن شُغّلت، أعِد توليد
  # الأيقونات بالسكربت بعدها.
  adaptive_icon_background: "#102F26"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"
  windows:
    generate: true
    image_path: "assets/icon/icon-512.png"
    icon_size: 256

# ── حزمة MSIX لويندوز ───────────────────────────────────────────────────
#
#  أمر الإنتاج (على جهاز ويندوز — لا يبني على لينكس):
#      flutter build windows --release
#      dart run msix:create
#  الأول يولّد EXE في build\windows\x64\runner\Release\، والثاني يلفّه
#  حزمةَ .msix في المجلد نفسه اعتماداً على القيم أدناه.
#
#  ⚠ التوقيع للنشر: أضِف هنا `certificate_path` و`certificate_password`
#  (تُقرأ من متغيّر بيئة، لا تُكتب نصاً) بشهادة Authenticode حقيقية. بدونها
#  تُنتَج حزمةٌ غير موقَّعة تصلح للتجربة الداخلية فقط — راجع WINDOWS_DEPLOY_AR.md.
msix_config:
  display_name: DENTSHINE
  publisher_display_name: Dental Clinic
  identity_name: com.dental.clinic
  msix_version: 1.0.0.0
  logo_path: assets/icon/icon-512.png
  languages: ar, en
  # أدنى قدرة تلزم فعلاً: اتصال الشبكة الصادر لمزامنة Supabase/R2 فقط. لا
  # صلاحيات ملفات/موقع/كاميرا — لا يطلبها منطق سطح المكتب.
  capabilities: internetClient
  # مطابق لموضوع الشهادة (Subject/CN) عند التوقيع. قيمة نائبة موثّقة تُستبدل
  # بموضوع الشهادة الحقيقي عند النشر — يجب أن يتطابقا وإلا رُفض تثبيت الحزمة.
  publisher: CN=Dental Clinic
  # توزيع مباشر (تثبيت جانبي بشهادة موثوقة) لا عبر متجر Microsoft.
  store: false
  # x64 هي منصّة سطح المكتب المستهدفة الوحيدة (وهو افتراض الأداة أصلاً،
  # يُثبَّت صراحةً منعاً لأي انزلاق إلى بناء ARM64 غير مُختبَر).
  architecture: x64
  # لا تُثبِّت الأداة شهادةً في مخزن النظام تلقائياً: التثبيت يخصّ النشر
  # ويحتاج صلاحية مسؤول، ولا محلّ له في بناء CI غير الموقَّع.
  install_certificate: false

# ── م83 — تشفير القاعدة عند السكون: SQLCipher بدل SQLite العادية ─────────
#
#  حزمة `sqlite3` تدعم SQLCipher عبر خطّاف الأصول الأصيلة، وتبديلُ المصدر
#  هنا يجعل **كل** فتح قاعدة يمرّ عبر مكتبة تفهم `PRAGMA key` — بلا تغيير
#  سطر واحد في شيفرة التطبيق.
#
#  ⚠ لا تغيّر هذه القيمة. SQLite العادية **تتجاهل `PRAGMA key` صامتةً**:
#  لا خطأ ولا تحذير، فتُكتب بيانات المرضى نصّاً مقروءاً بينما يظنّ التطبيق
#  أنه يشفّر. ولهذا حارسان:
#    ١) اختبار يتحقق من هذا السطر نفسه (`م83/ز`) — يمنع شحن قيمة خاطئة.
#    ٢) فحص `PRAGMA cipher_version` وقت التشغيل في `openBootstrappedDb` —
#       يوقف الإقلاع بدل الكتابة نصّاً لو أفلتت القيمة رغم ذلك.
#
#  ملاحظة لمن يبني على توزيعة لينكس قديمة: المكتبة الجاهزة تتطلّب
#  glibc ≥ 2.38. وعلى أقدم منها تفشل بـ`GLIBC_2.38 not found`، والحل بناء
#  SQLCipher محلياً وتوجيه المصدر إليه **مؤقّتاً** بـ
#  `source: system` + `name_linux: /usr/local/lib/libsqlcipher.so` —
#  وإعادة السطر إلى ما هو عليه قبل أي بناء إصدار (والاختبار يذكّرك).
#  أندرويد وويندوز — وهما منصّتا هذا المنتج — لا يمسّهما ذلك إطلاقاً.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
